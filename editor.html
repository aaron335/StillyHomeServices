<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stilly Site Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--sky:#35b4ec;--sky-deep:#0e86be;--ink:#16181d;--muted:#5a6473;--line:#dbe6ef;--bg:#eef3f7}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  .bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px}
  .bar.row1{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .bar.row2{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 18px}
  .title{font-weight:800;font-size:1.05rem}
  .title small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:.9rem;cursor:pointer;background:#eef6fb;color:var(--sky-deep)}
  .btn:hover{background:#e0f0fa}
  .btn.primary{background:var(--sky-deep);color:#fff}
  .btn.primary:hover{background:#0b6f9e}
  .btn:disabled{opacity:.4;cursor:default}
  .iconbtn{border:1px solid var(--line);background:#fff;border-radius:7px;width:36px;height:36px;font-size:1rem;cursor:pointer}
  .iconbtn:hover{background:#f2f9fd}
  .field{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);font-weight:700}
  .field input{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:.88rem;font-family:inherit;color:var(--ink)}
  .status{font-size:.8rem;color:var(--muted);font-weight:600}
  .status.ok{color:#0e8f57}
  .hintbar{background:#f0f9ff;color:#0b5c82;font-size:.8rem;padding:7px 18px;border-bottom:1px solid #cfe8f6}
  .hintbar b{color:#083f5c}
  .stage-wrap{padding:22px;display:flex;justify-content:center;overflow:auto;height:calc(100vh - 150px)}
  #stage{width:100%;max-width:1120px;background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(11,111,158,.14);overflow:hidden;align-self:flex-start}
</style>
</head>
<body>
  <div class="bar row1">
    <div class="title">Stilly Site Editor<small>Click any text on the page to edit it</small></div>
    <div class="tools">
      <button class="iconbtn" id="undo" title="Undo">↶</button>
      <button class="iconbtn" id="redo" title="Redo">↷</button>
      <button class="btn" id="download">⬇ Download</button>
      <button class="btn" id="save">💾 Save local</button>
      <button class="btn primary" id="publish">🚀 Publish live</button>
    </div>
  </div>
  <div class="bar row2">
    <span class="field">Phone <input type="tel" id="f-phone" size="16"></span>
    <span class="field">Email <input type="email" id="f-email" size="26"></span>
    <span class="status" id="status">Not saved yet</span>
  </div>
  <div class="hintbar">Edit anything on the page → click <b>Publish live</b> and enter your password → your site updates in about a minute. (<b>Save local</b> / <b>Download</b> save a copy to your computer instead.)</div>
  <div class="stage-wrap"><div id="stage"></div></div>

<script>
const SITE_CSS = `
  :root{--sky:#35b4ec;--sky-deep:#0e86be;--sky-deeper:#0b6f9e;--ink:#16181d;--muted:#5a6473;--line:#e2edf4;--bg:#ffffff;--bg-soft:#f2f9fd;--radius:12px;--maxw:1080px;font-size:16px;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.6;background:var(--bg)}
  a{color:var(--sky-deep);text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
  .btn{display:inline-block;background:var(--sky-deep);color:#fff;padding:14px 26px;border-radius:var(--radius);font-weight:700;border:none;cursor:pointer;font-size:1rem}
  .btn-ghost{background:transparent;border:2px solid #fff;color:#fff}
  h1,h2,h3{color:var(--ink);line-height:1.2;font-weight:800}
  h2{font-size:1.9rem;margin-bottom:10px}
  h2 .accent{color:var(--sky-deep)}
  .section{padding:70px 0}
  .section.soft{background:var(--bg-soft)}
  .lead{color:var(--muted);font-size:1.1rem;max-width:640px;margin:0 auto 40px;text-align:center}
  .center{text-align:center}
  .rule{width:64px;height:4px;background:var(--sky);border-radius:4px;margin:0 auto 26px}
  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;max-width:var(--maxw);margin:0 auto}
  .brand-lockup{display:flex;align-items:center;gap:12px;text-decoration:none}
  .brand-logo{height:60px;width:auto;display:block}
  .nav-links{display:flex;gap:24px;align-items:center}
  .nav-links a{color:var(--ink);font-weight:600}
  .nav-cta{background:var(--sky-deep);color:#fff;padding:9px 18px;border-radius:8px}
  @media(max-width:780px){.nav-links a:not(.nav-cta){display:none}}
  .hero{background:linear-gradient(135deg,var(--sky-deep),var(--sky-deeper));color:#fff;padding:78px 0 88px;position:relative;overflow:hidden}
  .hero .wrap{text-align:center;position:relative;z-index:2}
  .hero h1{color:#fff;font-size:2.7rem;margin-bottom:16px}
  .hero p{font-size:1.2rem;color:#e3f4ff;max-width:640px;margin:0 auto 30px}
  .hero-badges{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:7px 15px;border-radius:999px;font-size:.85rem;font-weight:600}
  .hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .hero-river{position:absolute;left:0;bottom:-2px;width:100%;height:70px;z-index:1;opacity:.35}
  @media(max-width:560px){.hero h1{font-size:2rem}}
  .grid{display:grid;gap:22px}
  .services-grid{grid-template-columns:repeat(3,1fr)}
  @media(max-width:820px){.services-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.services-grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px}
  .card h3{font-size:1.15rem;margin-bottom:8px}
  .card p{color:var(--muted);font-size:.95rem}
  .card .ic{font-size:1.7rem;margin-bottom:10px}
  .why-grid{grid-template-columns:repeat(4,1fr)}
  @media(max-width:820px){.why-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:460px){.why-grid{grid-template-columns:1fr}}
  .why-item{text-align:center;padding:10px}
  .why-item .num{font-size:1.5rem}
  .why-item h3{font-size:1.05rem;margin:10px 0 4px}
  .why-item p{color:var(--muted);font-size:.9rem}
  .gallery{grid-template-columns:repeat(3,1fr)}
  @media(max-width:700px){.gallery{grid-template-columns:repeat(2,1fr)}}
  .photo-slot{aspect-ratio:4/3;background:var(--bg-soft);border:2px dashed #b9e0f2;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--sky-deep);font-size:.85rem;text-align:center;padding:12px;font-weight:500}
  .photo-img{aspect-ratio:4/3;width:100%;object-fit:cover;border-radius:var(--radius)}
  .area-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:760px;margin:0 auto}
  .area-list span{background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--sky-deep)}
  .quote{background:linear-gradient(135deg,var(--sky-deep),var(--sky-deeper));color:#fff}
  .quote h2{color:#fff}.quote .lead{color:#e3f4ff}.quote .rule{background:#fff;opacity:.6}
  .form-card{background:#fff;border-radius:16px;padding:32px;max-width:560px;margin:0 auto;color:var(--ink)}
  .form-row{display:flex;gap:14px}
  @media(max-width:520px){.form-row{flex-direction:column}}
  .field{margin-bottom:16px;flex:1}
  .field label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px;color:var(--ink)}
  .field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:1rem;font-family:inherit}
  .field textarea{resize:vertical;min-height:110px}
  .form-card .btn{width:100%}
  .form-note{font-size:.8rem;color:var(--muted);text-align:center;margin-top:12px}
  footer{background:var(--ink);color:#c3cddb;padding:40px 0;text-align:center;font-size:.9rem}
  footer .foot-brand{font-family:'Pacifico',cursive;color:#fff;font-size:1.5rem;margin-bottom:12px}
  .contact-strip{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .contact-strip a,.contact-strip span{color:#e8eef5;font-weight:600;font-size:1.02rem}
`;
const EDIT_CSS = `
  .section{position:relative}
  [data-bind]{transition:outline .1s;border-radius:3px}
  [data-bind]:hover{outline:2px dashed rgba(14,134,190,.5);outline-offset:3px}
  [data-bind]:focus{outline:2px solid #0e86be;outline-offset:3px;background:rgba(53,180,236,.06)}
  .card,.why-item,.gal-item{position:relative}
  .ed-ctrl{position:absolute;top:6px;right:6px;display:none;gap:3px;z-index:5}
  .card:hover .ed-ctrl,.why-item:hover .ed-ctrl,.gal-item:hover .ed-ctrl{display:flex}
  .ed-ctrl button{width:23px;height:23px;border:none;border-radius:5px;background:#0e86be;color:#fff;font-size:11px;cursor:pointer;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .ed-ctrl button.del{background:#c0392b}
  .ed-add{display:flex;align-items:center;justify-content:center;border:2px dashed #7cc7ea;color:#0e86be;background:#f2f9fd;cursor:pointer;font-weight:700;font-size:1rem;min-height:130px;border-radius:12px;font-family:inherit}
  .gal-item .ed-ctrl{top:8px;right:8px}
  .area-chip-wrap{position:relative;display:inline-flex}
  .area-del{position:absolute;top:-8px;right:-8px;width:19px;height:19px;border:none;border-radius:50%;background:#c0392b;color:#fff;font-size:11px;cursor:pointer;display:none;line-height:1}
  .area-chip-wrap:hover .area-del{display:block}
  .area-add{cursor:pointer;border:2px dashed #7cc7ea;color:#0e86be;background:#f2f9fd;font-weight:700;padding:8px 16px;border-radius:999px;font-size:.9rem;font-family:inherit}
  .badge-wrap{position:relative;display:inline-flex}
  .bdel{position:absolute;top:-8px;right:-8px;width:17px;height:17px;border:none;border-radius:50%;background:#c0392b;color:#fff;font-size:10px;cursor:pointer;display:none;line-height:1}
  .badge-wrap:hover .bdel{display:block}
  .badge-add{cursor:pointer;border:1px dashed rgba(255,255,255,.7);color:#fff;background:rgba(255,255,255,.12);font-weight:700;font-family:inherit;padding:7px 15px;border-radius:999px;font-size:.85rem}
  .ed-sec{position:absolute;top:10px;left:10px;display:none;gap:4px;z-index:6}
  .section:hover>.ed-sec{display:flex}
  .ed-sec button{width:27px;height:27px;border:none;border-radius:6px;background:#16181d;color:#fff;cursor:pointer;opacity:.9;font-size:.8rem}
`;

const data = {
  phone:"[YOUR PHONE]", email:"aaron@stillyhomeservices.com",
  heroTitle:"Professional Painting for Snohomish County Homes",
  heroSubtext:"Interior & exterior painting done clean, detailed, and on time. Owner-operated.",
  heroCtaLabel:"Get a Free Quote",
  badges:["✓ Interior & Exterior","✓ Spray, Mask & Fine Finish","✓ Free Estimates","✓ Locally Owned"],
  sectionMeta:{
    services:{heading:"What We Do",lead:"Quality work with careful prep, clean masking, and a professional finish — inside and out."},
    why:{heading:"Why Homeowners Choose Stilly",lead:"You're hiring the owner — not a rotating crew. That means accountability on every job."},
    work:{heading:"Recent Work",lead:"A few recent projects around Snohomish County."},
    area:{heading:"Areas We Serve",lead:"Proudly serving Arlington, Stanwood, and the surrounding Snohomish County communities."},
    quote:{heading:"Request a Free Quote",lead:"Tell me about your project and I'll get back to you with an estimate."}
  },
  services:[
    {icon:"🏠",title:"Interior Painting",desc:"Walls, ceilings, trim, and baseboards. Careful masking and clean lines in every room."},
    {icon:"🖌️",title:"Exterior Painting",desc:"Siding, trim, and doors sprayed and finished to protect and refresh your home's curb appeal."},
    {icon:"🚪",title:"Cabinet & Trim Finishing",desc:"Smooth, durable finishes on cabinets, trim, and millwork for a factory-quality look."},
    {icon:"🔧",title:"Prep & Repair",desc:"Drywall patching, caulking, sanding, and surface prep so the paint lasts and looks right."},
    {icon:"🌲",title:"Deck & Fence Staining",desc:"Staining and sealing to protect outdoor wood from Pacific Northwest weather."},
    {icon:"🪚",title:"Finish Carpentry",desc:"Trim, molding, and small cabinetry installs to finish a space the right way."}
  ],
  why:[
    {icon:"👷",title:"Owner-Operated",desc:"You deal directly with me from quote to final walkthrough."},
    {icon:"🎯",title:"Detail-Focused",desc:"Clean masking, sharp lines, and thorough prep on every project."},
    {icon:"🗣️",title:"Clear Communication",desc:"Straight answers, honest timelines, and no surprises."},
    {icon:"📍",title:"Local & Reliable",desc:"Based right here in the Stillaguamish Valley, serving your neighbors."}
  ],
  photos:[],
  areas:["Arlington","Stanwood","Smokey Point","Marysville","Silvana","Lakewood","Warm Beach","Camano Island","Darrington","Granite Falls","Lake Stevens","Snohomish","Everett","Mount Vernon","Sedro-Woolley"],
  sectionOrder:["services","work","area","why"]
};

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const tel=p=>String(p).replace(/[^0-9+]/g,"");
function accentHead(t){const w=String(t).trim().split(/\s+/);if(w.length<2)return esc(t);const last=w.pop();return esc(w.join(' '))+' <span class="accent">'+esc(last)+'</span>';}
function setPath(o,path,v){const p=path.split(".");let t=o;for(let i=0;i<p.length-1;i++)t=t[p[i]];t[p[p.length-1]]=v;}
function eb(edit,bind){return edit?` contenteditable="true" data-bind="${bind}"`:"";}
function edCtrl(list,i){return `<div class="ed-ctrl"><button data-op="up" data-list="${list}" data-i="${i}" title="Move up">↑</button><button data-op="down" data-list="${list}" data-i="${i}" title="Move down">↓</button><button class="del" data-op="del" data-list="${list}" data-i="${i}" title="Remove">✕</button></div>`;}
function secCtrl(edit,key){return edit?`<div class="ed-sec"><button data-op="secup" data-key="${key}" title="Move section up">▲</button><button data-op="secdown" data-key="${key}" title="Move section down">▼</button></div>`:"";}

function sectionHTML(key,o){
  const e=o.edit,m=data.sectionMeta[key];
  const head=`${secCtrl(e,key)}<div class="wrap"><h2 class="center"${eb(e,`sectionMeta.${key}.heading`)}>${accentHead(m.heading)}</h2><div class="rule"></div><p class="lead"${eb(e,`sectionMeta.${key}.lead`)}>${esc(m.lead)}</p>`;
  if(key==="services"||key==="why"){
    const list=key, cls=key==="services"?"card":"why-item", ictag=key==="services"?"ic":"num", grid=key==="services"?"services-grid":"why-grid";
    const items=data[list].map((s,i)=>`<div class="${cls}">${e?edCtrl(list,i):""}<div class="${ictag}"${eb(e,`${list}.${i}.icon`)}>${esc(s.icon)}</div><h3${eb(e,`${list}.${i}.title`)}>${esc(s.title)}</h3><p${eb(e,`${list}.${i}.desc`)}>${esc(s.desc)}</p></div>`).join("");
    const add=e?`<button class="${cls} ed-add" data-op="add" data-list="${list}">＋ Add</button>`:"";
    return `<section class="section${key==="why"?" soft":""}" id="${key}">${head}<div class="grid ${grid}">${items}${add}</div></div></section>`;
  }
  if(key==="work"){
    let inner;
    if(e){
      inner=data.photos.map((p,i)=>`<div class="gal-item"><img class="photo-img" src="${p.src}" alt="${esc(p.caption||'')}">${edCtrl('photos',i)}</div>`).join("")
        +`<label class="ed-add" style="aspect-ratio:4/3;min-height:0">＋ Add photo<input type="file" accept="image/*" hidden data-op="addphoto"></label>`;
    } else {
      inner = data.photos.length ? data.photos.map(p=>`<img class="photo-img" src="${p.src}" alt="${esc(p.caption||'Stilly Home Services project')}">`).join("")
        : ["interior repaint","exterior / siding","cabinets / trim","before","after","a finished room"].map(t=>`<div class="photo-slot">Add photo — ${t}</div>`).join("");
    }
    return `<section class="section" id="work">${head}<div class="grid gallery">${inner}</div></div></section>`;
  }
  if(key==="area"){
    const towns=data.areas.map((a,i)=> e
      ? `<span class="area-chip-wrap"><span${eb(e,`areas.${i}`)}>${esc(a)}</span><button class="area-del" data-op="deltown" data-i="${i}" title="Remove">✕</button></span>`
      : `<span>${esc(a)}</span>`).join("");
    const add=e?`<button class="area-add" data-op="addtown">＋ Add town</button>`:"";
    return `<section class="section soft" id="area">${head}<div class="area-list">${towns}${add}</div></div></section>`;
  }
  return "";
}

function renderBody(o){
  const e=o.edit;
  const mid=data.sectionOrder.map(k=>sectionHTML(k,o)).join("\n");
  const badges = data.badges.map((b,i)=> e
    ? `<span class="badge-wrap"><span class="badge"${eb(e,`badges.${i}`)}>${esc(b)}</span><button class="bdel" data-op="delbadge" data-i="${i}" title="Remove">✕</button></span>`
    : `<span class="badge">${esc(b)}</span>`).join("")
    + (e?`<button class="badge-add" data-op="addbadge">＋</button>`:"");
  return `<header><div class="nav">
  <a class="brand-lockup" href="#" aria-label="Stilly Home Services LLC — home"><img src="${o.logoSrc}" alt="Stilly Home Services LLC" class="brand-logo"></a>
  <nav class="nav-links"><a href="#services">Services</a><a href="#area">Service Area</a><a href="#why">Why Us</a><a href="#quote" class="nav-cta">Free Quote</a></nav>
</div></header>
<section class="hero"><div class="wrap">
  <h1${eb(e,"heroTitle")}>${esc(data.heroTitle)}</h1>
  <p${eb(e,"heroSubtext")}>${esc(data.heroSubtext)}</p>
  <div class="hero-cta"><a href="#quote" class="btn"${eb(e,"heroCtaLabel")}>${esc(data.heroCtaLabel)}</a><a href="tel:${tel(data.phone)}" class="btn btn-ghost">Call ${esc(data.phone)}</a></div>
  <div class="hero-badges">${badges}</div>
</div>
<svg class="hero-river" viewBox="0 0 1440 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 60 C 240 20, 480 20, 720 45 C 960 70, 1200 70, 1440 35 L1440 70 L0 70 Z" fill="#ffffff"/></svg></section>
${mid}
<section class="section quote" id="quote">${secCtrl(false)}<div class="wrap"><h2 class="center"${eb(e,"sectionMeta.quote.heading")}>${esc(data.sectionMeta.quote.heading)}</h2><div class="rule"></div><p class="lead"${eb(e,"sectionMeta.quote.lead")}>${esc(data.sectionMeta.quote.lead)}</p>
<div class="form-card"><form id="quoteForm">
<div class="form-row"><div class="field"><label for="name">Name</label><input type="text" id="name" name="name" required></div><div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="phone" required></div></div>
<div class="field"><label for="email">Email</label><input type="email" id="email" name="email"></div>
<div class="field"><label for="service">Project Type</label><select id="service" name="service"><option>Interior Painting</option><option>Exterior Painting</option><option>Cabinet / Trim Finishing</option><option>Deck / Fence Staining</option><option>Finish Carpentry</option><option>Other / Not Sure</option></select></div>
<div class="field"><label for="message">Project Details</label><textarea id="message" name="message" placeholder="Rooms, square footage, timeline, or anything else that helps."></textarea></div>
<button type="submit" class="btn">Send My Request</button>
<p class="form-note">Prefer to talk? Email <a href="mailto:${esc(data.email)}">${esc(data.email)}</a> or call ${esc(data.phone)}.</p>
</form></div></div></section>
<footer><div class="wrap"><div class="foot-brand">Stilly Home Services LLC</div>
<div class="contact-strip"><a href="mailto:${esc(data.email)}">📧 ${esc(data.email)}</a><span>📞 ${esc(data.phone)}</span><span>📍 Arlington & Stanwood, WA</span></div>
<p style="margin-top:20px;opacity:.7">© <span id="yr"></span> Stilly Home Services LLC · Interior & Exterior Painting · Finish Carpentry · Licensed & Insured</p></div></footer>`;
}

function buildExport(){
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stilly Home Services LLC | Interior & Exterior Painting — Arlington & Stanwood, WA</title>
<meta name="description" content="Professional interior and exterior painting for homes in Arlington, Stanwood, and greater Snohomish County. Owner-operated, clean, detailed work. Free quotes.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>${SITE_CSS}</style>
</head>
<body>
${renderBody({edit:false,logoSrc:"logo.png"})}
<script>
document.getElementById('yr').textContent=new Date().getFullYear();
var BUSINESS_EMAIL=${JSON.stringify(data.email)};
document.getElementById('quoteForm').addEventListener('submit',function(e){e.preventDefault();var f=e.target;var subject="Quote Request — "+f.service.value+" — "+f.name.value;var body="Name: "+f.name.value+"\\nPhone: "+f.phone.value+"\\nEmail: "+f.email.value+"\\nProject Type: "+f.service.value+"\\n\\nDetails:\\n"+f.message.value;window.location.href="mailto:"+BUSINESS_EMAIL+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);});
<\/script>
</body>
</html>`;
}

// ---------- stage / shadow ----------
const LOGO_ABS=(new URL("logo.png",location.href)).href;
const HOST_VARS=`:host{--sky:#35b4ec;--sky-deep:#0e86be;--sky-deeper:#0b6f9e;--ink:#16181d;--muted:#5a6473;--line:#e2edf4;--bg:#ffffff;--bg-soft:#f2f9fd;--radius:12px;--maxw:1080px}`;
const stage=document.getElementById('stage');
const root=stage.attachShadow({mode:'open'});
function rebuild(){root.innerHTML=`<style>${HOST_VARS}${SITE_CSS}${EDIT_CSS}</style>`+renderBody({edit:true,logoSrc:LOGO_ABS});}

// ---------- history ----------
let present=JSON.stringify(data), undoStack=[], redoStack=[], histTimer=null;
function snapshot(){return JSON.stringify(data);}
function commit(){undoStack.push(present);present=snapshot();redoStack.length=0;if(undoStack.length>100)undoStack.shift();updateUndo();markDirty();}
function commitSoon(){clearTimeout(histTimer);histTimer=setTimeout(commit,600);}
function restore(str){data.__proto__;const d=JSON.parse(str);Object.keys(data).forEach(k=>delete data[k]);Object.assign(data,d);}
function undo(){if(!undoStack.length)return;redoStack.push(present);present=undoStack.pop();restore(present);rebuild();syncFields();updateUndo();markDirty();}
function redo(){if(!redoStack.length)return;undoStack.push(present);present=redoStack.pop();restore(present);rebuild();syncFields();updateUndo();markDirty();}
function updateUndo(){document.getElementById('undo').disabled=!undoStack.length;document.getElementById('redo').disabled=!redoStack.length;}

// ---------- status ----------
const statusEl=document.getElementById('status');
function markDirty(){statusEl.textContent="Unsaved changes";statusEl.className="status";statusEl.style.color="";}
function markSaved(t){statusEl.textContent=t;statusEl.className="status ok";statusEl.style.color="";}
function markBusy(t){statusEl.textContent=t;statusEl.className="status";statusEl.style.color="";}
function markErr(t){statusEl.textContent=t;statusEl.className="status";statusEl.style.color="#c0392b";}

// ---------- edits inside preview ----------
root.addEventListener('input',e=>{const el=e.target.closest('[data-bind]');if(!el)return;setPath(data,el.dataset.bind,el.textContent);commitSoon();});
root.addEventListener('change',e=>{const inp=e.target.closest('[data-op="addphoto"]');if(inp&&inp.files[0])addPhoto(inp.files[0]);});
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-op]');if(!b)return;
  const op=b.dataset.op, list=b.dataset.list, i=+b.dataset.i;
  if(op==='add'){data[list].push({icon:"✨",title:"New "+(list==='services'?'service':'point'),desc:"Description goes here."});}
  else if(op==='up'){move(data[list],i,-1);}
  else if(op==='down'){move(data[list],i,1);}
  else if(op==='del'){data[list].splice(i,1);}
  else if(op==='secup'){const k=b.dataset.key,idx=data.sectionOrder.indexOf(k);move(data.sectionOrder,idx,-1);}
  else if(op==='secdown'){const k=b.dataset.key,idx=data.sectionOrder.indexOf(k);move(data.sectionOrder,idx,1);}
  else if(op==='addtown'){data.areas.push("New town");}
  else if(op==='deltown'){data.areas.splice(i,1);}
  else if(op==='addbadge'){data.badges.push("✓ New badge");}
  else if(op==='delbadge'){data.badges.splice(i,1);}
  else return;
  rebuild();commit();
});
function move(a,i,d){const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];}
function addPhoto(file){const img=new Image(),rd=new FileReader();rd.onload=()=>{img.onload=()=>{const max=1200;let w=img.width,h=img.height;if(w>max){h=Math.round(h*max/w);w=max;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);data.photos.push({src:c.toDataURL('image/jpeg',0.82),caption:""});rebuild();commit();};img.src=rd.result;};rd.readAsDataURL(file);}

// ---------- toolbar fields ----------
function syncFields(){document.getElementById('f-phone').value=data.phone;document.getElementById('f-email').value=data.email;}
document.getElementById('f-phone').addEventListener('input',e=>{data.phone=e.target.value;rebuild();commitSoon();});
document.getElementById('f-email').addEventListener('input',e=>{data.email=e.target.value;rebuild();commitSoon();});
document.getElementById('undo').addEventListener('click',undo);
document.getElementById('redo').addEventListener('click',redo);

// ---------- save ----------
let fileHandle=null;
function downloadFile(){const blob=new Blob([buildExport()],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);markSaved("Downloaded index.html — move it into your folder, then Commit + Push");}
document.getElementById('download').addEventListener('click',downloadFile);
document.getElementById('save').addEventListener('click',async()=>{
  const html=buildExport();
  if(!window.showSaveFilePicker){downloadFile();return;}
  try{
    if(!fileHandle){fileHandle=await window.showSaveFilePicker({suggestedName:'index.html',types:[{description:'HTML file',accept:{'text/html':['.html']}}]});}
    const w=await fileHandle.createWritable();await w.write(html);await w.close();
    markSaved("Saved ✓ — now Commit + Push in GitHub Desktop");
  }catch(err){if(err&&err.name==='AbortError')return;console.error(err);downloadFile();}
});

// ---------- publish live (hosted cloud editor) ----------
let sessionPassword=null;
document.getElementById('publish').addEventListener('click',async()=>{
  const pw=sessionPassword||prompt('Editor password (to publish your site live):');
  if(!pw)return;
  sessionPassword=pw;
  markBusy('Publishing…');
  try{
    const r=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,html:buildExport()})});
    if(r.ok){markSaved('Published ✓ — your site updates in ~1 min');}
    else if(r.status===401){sessionPassword=null;markErr('Wrong password — click Publish live to try again');}
    else{const j=await r.json().catch(()=>({}));markErr('Publish failed'+(j&&j.error?': '+j.error:''));}
  }catch(e){markErr('Publish failed — this only works on the hosted editor (editor.stillyhomeservices.com)');}
});

// ---------- init ----------
syncFields();rebuild();updateUndo();
</script>
</body>
</html>
